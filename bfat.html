<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Fat Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('background3.jpg') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            color: black;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;

            
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent background for readability */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            margin: auto;
        }

        h2 {
            text-align: center;
            color: green;
        }

        .unit-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .unit-tabs button {
            flex: 1;
            padding: 8px;
            border: none;
            background: #ddd;
            cursor: pointer;
        }

        .unit-tabs .active {
            background: #0044cc;
            color: white;
        }

        .gender-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
        }

        .gender-group label {
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .calculate-btn {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: green;
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: linear-gradient(to right, red, yellow, green, yellow, red);
            margin-top: 10px;
            position: relative;
            border-radius: 10px;
        }

        .indicator {
            width: 10px;
            height: 15px;
            background: black;
            position: absolute;
            top: 0;
        }

        .table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        .table td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .table tr:nth-child(even) {
            background: #f2f2f2;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background: gray;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Body Fat: <span id="result">--</span>%</h2>

    <div class="unit-tabs">
        <button class=""></button>
        <button></button>
        <button></button>
    </div>

    <div class="gender-group">
        <label><input type="radio" name="gender" value="male" checked> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
    </div>

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter age">

    <label>Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter weight">

    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="Enter height in cm">

    <label>Neck (cm)</label>
    <input type="number" id="neck" placeholder="Enter neck size">

    <label>Waist (cm)</label>
    <input type="number" id="waist" placeholder="Enter waist size">

    <button class="calculate-btn" onclick="calculateBodyFat()">Calculate</button>

    <div class="result" id="bodyFatResult"></div>

    <div class="progress-bar">
        <div class="indicator" id="indicator"></div>
    </div>

    <table class="table">
        <tr>
            <td>Body Fat (U.S. Navy Method)</td>
            <td id="bfNavy">-- %</td>
        </tr>
        <tr>
            <td>Body Fat Category</td>
            <td id="category">--</td>
        </tr>
        <tr>
            <td>Body Fat Mass</td>
            <td id="fatMass">-- kg</td>
        </tr>
        <tr>
            <td>Lean Body Mass</td>
            <td id="leanMass">-- kg</td>
        </tr>
        <tr>
            <td>Ideal Body Fat</td>
            <td>10.5%</td>
        </tr>
    </table>

    <button class="reset-btn" onclick="resetForm()">Clear</button>
</div>

<script>
    function calculateBodyFat() {
        let gender = document.querySelector('input[name="gender"]:checked').value;
        let age = document.getElementById("age").value;
        let weight = document.getElementById("weight").value;
        let height = document.getElementById("height").value;
        let neck = document.getElementById("neck").value;
        let waist = document.getElementById("waist").value;

        if (!age || !weight || !height || !neck || !waist) {
            alert("Please fill all fields!");
            return;
        }

        let bodyFat;

        if (gender === "male") {
            bodyFat = 86.01 * Math.log10(waist - neck) - 70.041 * Math.log10(height) + 36.76;
        } else {
            bodyFat = 163.205 * Math.log10(waist + height - neck) - 97.684 * Math.log10(height) - 78.387;
        }

        bodyFat = bodyFat.toFixed(1);
        document.getElementById("result").innerText = bodyFat + "%";
        document.getElementById("bodyFatResult").innerText = "Your Body Fat: " + bodyFat + "%";
        document.getElementById("bfNavy").innerText = bodyFat + "%";

        let indicatorPosition = (bodyFat / 40) * 100;
        document.getElementById("indicator").style.left = indicatorPosition + "%";

        document.getElementById("fatMass").innerText = (weight * (bodyFat / 100)).toFixed(1) + " kg";
        document.getElementById("leanMass").innerText = (weight - (weight * (bodyFat / 100))).toFixed(1) + " kg";

        let category = bodyFat < 6 ? "Essential" : bodyFat < 14 ? "Athletes" : bodyFat < 18 ? "Fitness" : bodyFat < 25 ? "Average" : "Obese";
        document.getElementById("category").innerText = category;
    }

    function resetForm() {
        document.getElementById("bodyFatResult").innerText = "";
    }
</script>

</body>
</html>
