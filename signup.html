<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('background2.jpg'); /* Replace with your image */
            background-size: cover;
            background-position: center;
        }
        .container {
            width: 50%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            position: relative;
            width: 100%;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #4c57ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn:hover {
            background: #3742fa;
        }
        .login-link {
            display: block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create an Account</h2>
        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
            
            <label>Email address</label>
            <input type="email" placeholder="Email address" required>
            
            <label>Password</label>
            <div class="input-group">
                <input type="password" id="password" placeholder="Create a password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
            </div>

            <label>Confirm Password</label>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">👁</button>
            </div>

            <button type="submit" class="btn">Sign Up</button>
            <a href="login.html" class="login-link">Already have an account? Sign in</a>
        </form>
    </div>

    <script>
        function togglePassword(fieldId) {
            var passwordField = document.getElementById(fieldId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }
    </script>
</body>
</html>
