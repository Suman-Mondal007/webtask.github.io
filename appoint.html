<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('health.jpg') no-repeat center center/cover;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 80px;
        }

        .submit-btn {
            background: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 18px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #219150;
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 0, 0.8);
            color: black;
            padding: 10px;
            margin-top: 15px;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Doctor Appointment Booking</h2>
        <form id="appointmentForm">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="date">Appointment Date:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="message">Additional Message (Optional):</label>
                <textarea id="message" placeholder="Mention any symptoms or concerns..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Book Appointment</button>
        </form>

        <div class="success-message" id="successMessage">✅ Appointment Successfully Submitted!</div>
    </div>

    <script>
        document.getElementById("appointmentForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form from refreshing the page

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const date = document.getElementById("date").value;

            if (name && email && phone && date) {
                document.getElementById("successMessage").style.display = "block"; // Show success message
                setTimeout(function() {
                    document.getElementById("appointmentForm").reset(); // Clear the form
                    document.getElementById("successMessage").style.display = "none"; // Hide message
                    location.reload(); // Refresh page
                }, 2000); // Refresh after 2 seconds
            } else {
                alert("⚠️ Please fill all required fields.");
            }
        });
    </script>

</body>
</html>
